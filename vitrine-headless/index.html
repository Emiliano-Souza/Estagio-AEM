<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vitrine de Aventuras WKND</title>

  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
  <header class="site-header">
    <div class="container">
      <p class="site-header__eyebrow">WKND Adventures</p>

      <h1>Encontre sua próxima aventura</h1>

      <p>
        Catálogo carregado diretamente dos Content Fragments do AEM.
      </p>
    </div>
  </header>

  <main class="container">

    <!-- Filtros -->

    <section class="filters" aria-labelledby="filters-title">
      <h2 id="filters-title">Filtrar por dificuldade</h2>

      <div class="filters__actions">

        <button
          type="button"
          data-difficulty=""
          class="filter-button is-active"
        >
          Todas
        </button>

        <button
          type="button"
          data-difficulty="facil"
          class="filter-button"
        >
          Fácil
        </button>

        <button
          type="button"
          data-difficulty="moderada"
          class="filter-button"
        >
          Moderada
        </button>

        <button
          type="button"
          data-difficulty="dificil"
          class="filter-button"
        >
          Difícil
        </button>

      </div>
    </section>

    <!-- Aventuras -->

    <section aria-labelledby="adventures-title">

      <div class="section-heading">
        <h2 id="adventures-title">
          Aventuras disponíveis
        </h2>

        <p
          id="results-count"
          aria-live="polite"
        ></p>
      </div>

      <div
        id="status"
        class="status"
        role="status"
      >
        Carregando aventuras...
      </div>

      <div
        id="adventures-list"
        class="adventures-grid"
      ></div>

    </section>

    <!-- Da Revista -->

    <section
      class="magazine"
      aria-labelledby="magazine-title"
    >

      <div class="section-heading">

        <div>
          <p class="section-heading__eyebrow">
            WKND Magazine
          </p>

          <h2 id="magazine-title">
            Da Revista
          </h2>
        </div>

        <p
          id="magazine-count"
          aria-live="polite"
        ></p>

      </div>

      <div
        id="magazine-status"
        class="status"
        role="status"
      >
        Carregando artigos...
      </div>

      <div
        id="magazine-list"
        class="magazine-grid"
      ></div>

    </section>

  </main>

  <script
    type="module"
    src="./js/app.js"
  ></script>
</body>
</html>
